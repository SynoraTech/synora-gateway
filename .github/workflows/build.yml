name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache-dependency-path: synora-gateway/go.sum

    - name: Verify modules
      run: cd synora-gateway && go mod verify

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5

    - name: Lint
      run: |
        cd synora-gateway
        golangci-lint run ./... --timeout=5m

    - name: Build
      run: cd synora-gateway && go build -v ./...

    - name: Test
      run: cd synora-gateway && go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./synora-gateway/coverage.txt
        fail_ci_if_error: false

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}


    - name: Build and push Docker image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: ./synora-gateway
        file: ./synora-gateway/deploy/Dockerfile
        push: true
        tags: |
          larrychen0125/synora:latest
          larrychen0125/synora:${{ github.sha }}


    - name: Update Docker Hub description
      if: github.event_name != 'pull_request'
      uses: peter-evans/dockerhub-description@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: larrychen0125/synora
        readme-filepath: ./README.md
